name: Cypress Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download previous Allure history (from Pages)
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          HISTORY_URL="https://${OWNER}.github.io/${REPO_NAME}/history.zip"
          echo "Attempting to download history from ${HISTORY_URL}"
          mkdir -p history-download allure-results/history
          STATUS=$(curl -w "%{http_code}" -sSLo history-download/history.zip "${HISTORY_URL}" || true)
          if [ "$STATUS" = "200" ]; then
            echo "history.zip found; extracting"
            unzip -o history-download/history.zip -d history-download >/dev/null 2>&1 || true
            if [ -d "history-download/history" ]; then
              cp -r history-download/history/* allure-results/history/ || true
              echo "Copied history files:" && ls -la allure-results/history || true
            else
              echo "history directory missing inside zip"
            fi
          else
            echo "No prior history.zip found (status $STATUS); likely first or clean run"
          fi

      - name: Run Cypress tests (Electron base)
        run: npm run cypress:run
        env:
          CI: true

      - name: Cross-browser smoke (Chrome)
        run: npx cypress run --browser chrome --spec "cypress/e2e/e2e-smoke.cy.js,cypress/e2e/nonfunctional.cy.js"
        env:
          CI: true

      - name: Cross-browser smoke (Firefox)
        run: npx cypress run --browser firefox --spec "cypress/e2e/e2e-smoke.cy.js,cypress/e2e/nonfunctional.cy.js"
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Inspect generated history
        if: always()
        run: |
          if [ -d "allure-report/history" ]; then
            echo "Generated history contents:" && ls -la allure-report/history
            echo "history-trend.json sample:" && head -n 40 allure-report/history/history-trend.json || true
          else
            echo "No history folder found in generated report"
          fi

      - name: Upload Allure report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Upload test results for history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

  deploy-report:
    if: always()
    needs: cypress-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Package history for next run
        run: |
          if [ -d "allure-report/history" ]; then
            echo "Packaging history.zip for next run"
            (cd allure-report && zip -r history.zip history >/dev/null)
            ls -la allure-report/history.zip || true
          else
            echo "No history folder found in generated report; trend data will not persist"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
