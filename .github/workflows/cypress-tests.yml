name: Cypress Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download previous Allure history (from Pages)
        if: always()
        continue-on-error: true
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          HISTORY_URL="https://${OWNER}.github.io/${REPO_NAME}/history.zip"
          echo "Attempting to download history from ${HISTORY_URL}"
          mkdir -p history-download allure-results/history
          if curl -fsSL "${HISTORY_URL}" -o history-download/history.zip; then
            unzip -o history-download/history.zip -d history-download >/dev/null 2>&1 || true
            if [ -d "history-download/history" ]; then
              cp -r history-download/history/* allure-results/history/ || true
            fi
          else
            echo "No prior history.zip found (likely first run)"
          fi

      - name: Run Cypress tests
        run: npm run cypress:run
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Upload test results for history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

  deploy-report:
    if: always()
    needs: cypress-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Package history for next run
        run: |
          if [ -d "allure-report/history" ]; then
            (cd allure-report && zip -r history.zip history >/dev/null)
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
